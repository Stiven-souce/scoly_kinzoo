<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi amada Scoly Kinzoo - Experiencia Bioluminescente</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Three.js CDN for 3D Coral Rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <style>
        body {
            background-color: #030a16;
            font-family: 'Montserrat', sans-serif;
            color: #f1f5f9;
            overflow-x: hidden;
            user-select: none;
        }

        .font-serif-title {
            font-family: 'Great Vibes', cursive;
        }

        .font-cinzel {
            font-family: 'Cinzel', serif;
        }

        /* Underwater Ambient Background */
        .underwater-bg {
            background: radial-gradient(ellipse at 50% 20%, rgba(14, 116, 144, 0.25) 0%, rgba(3, 10, 22, 1) 80%);
        }

        /* Glassmorphism Card */
        .glass-card {
            background: rgba(8, 22, 41, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 40px rgba(14, 165, 233, 0.15);
        }

        /* Canvas Floating Canvas Glow */
        .canvas-container {
            filter: drop-shadow(0 0 25px rgba(244, 114, 182, 0.35));
            transition: filter 1s ease-in-out;
        }

        .canvas-container.glowing {
            filter: drop-shadow(0 0 45px rgba(251, 146, 60, 0.6)) drop-shadow(0 0 20px rgba(56, 189, 248, 0.7));
        }

        /* Scrollbar Styling */
        .custom-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: rgba(56, 189, 248, 0.4);
            border-radius: 4px;
        }

        /* Typing Cursor Effect */
        .typing-cursor::after {
            content: '❘';
            animation: blink 0.8s infinite;
            color: #38bdf8;
            font-weight: 300;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* Water Caustic Ray Effect */
        .caustics {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,255,255,0.03) 0%, transparent 50%, rgba(56,189,248,0.03) 100%);
            pointer-events: none;
            z-index: 1;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-8 relative underwater-bg">

    <div class="caustics"></div>
    <canvas id="bubbleCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Ambient Audio Toggle Button -->
    <div class="fixed top-4 right-4 z-50">
        <button id="soundToggle" class="px-4 py-2 rounded-full glass-card text-xs text-cyan-200/90 hover:text-cyan-100 flex items-center gap-2 transition duration-300 border border-cyan-500/30 hover:border-cyan-400">
            <svg id="soundIcon" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2" />
            </svg>
            <span id="soundText">Ecos Marinos</span>
        </button>
    </div>

    <!-- Dedication Header -->
    <header class="text-center z-10 mt-2 mb-2">
        <h2 class="text-cyan-400/80 tracking-widest uppercase text-xs font-cinzel mb-1">Para mi amada</h2>
        <h1 class="text-4xl md:text-6xl font-serif-title text-transparent bg-clip-text bg-gradient-to-r from-pink-300 via-orange-300 to-cyan-300 drop-shadow-lg">
            Scoly Kinzoo
        </h1>
    </header>

    <main class="w-full max-w-6xl flex flex-col lg:flex-row items-center justify-center gap-6 z-10 my-auto">
        
        <!-- Left Column: 3D Scolymia / Coral Flower Rendering Container -->
        <div class="w-full lg:w-1/2 flex flex-col items-center justify-center relative min-h-[440px] md:min-h-[500px]">
            
            <!-- Radial Glow Backlight -->
            <div id="coralAura" class="absolute w-80 h-80 rounded-full bg-gradient-to-tr from-pink-500/20 via-cyan-400/20 to-orange-400/20 blur-3xl pointer-events-none opacity-40 transition-all duration-1000"></div>

            <!-- 3D Canvas WebGL Container -->
            <div id="threeContainer" class="canvas-container relative w-full h-[400px] md:h-[480px] rounded-2xl flex items-center justify-center cursor-grab active:cursor-grabbing">
                <!-- Three.js Canvas gets injected here -->
            </div>

            <!-- Interactive Hint & Status -->
            <div class="flex flex-col items-center gap-1 mt-1">
                <span class="text-[11px] text-cyan-300/60 font-mono tracking-wider flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 animate-spin" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                    </svg>
                    Arrastra para rotar &bull; Ruleta para zoom
                </span>
                <div id="statusIndicator" class="text-xs font-cinzel text-pink-300/80 tracking-widest">
                    Floreciendo arrecife de luz...
                </div>
            </div>
        </div>

        <!-- Right Column: Interactive Letter Glass Container -->
        <div class="w-full lg:w-1/2 flex flex-col items-center">
            <div class="glass-card w-full p-6 md:p-8 rounded-2xl relative overflow-hidden flex flex-col justify-between min-h-[420px] max-h-[520px]">
                
                <!-- Card Header -->
                <div class="flex items-center justify-between border-b border-cyan-500/20 pb-3 mb-4">
                    <span class="text-xs font-cinzel text-cyan-300 tracking-widest uppercase">Carta Marina Eterna</span>
                    <span class="text-xs text-slate-400 font-mono" id="dateDisplay"></span>
                </div>

                <!-- Letter Content Area -->
                <div class="custom-scroll overflow-y-auto pr-2 my-auto text-slate-200 leading-relaxed font-light text-sm md:text-base space-y-4">
                    <p id="typewriterText" class="inline whitespace-pre-wrap typing-cursor"></p>
                </div>

                <!-- Card Footer Actions -->
                <div id="cardFooter" class="border-t border-cyan-500/20 pt-4 mt-4 flex flex-wrap items-center justify-between gap-3 opacity-0 transition-opacity duration-1000">
                    <button id="replayBtn" class="text-xs text-cyan-300 hover:text-cyan-100 flex items-center gap-1.5 transition">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        Repetir Florecimiento
                    </button>

                    <button id="downloadBtn" class="px-5 py-2.5 rounded-xl bg-gradient-to-r from-pink-500 via-purple-500 to-cyan-500 text-white font-medium text-xs md:text-sm tracking-wide shadow-lg shadow-pink-500/20 hover:shadow-cyan-500/40 hover:scale-[1.02] active:scale-95 transition duration-300 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Descargar Arte y Carta (.html)
                    </button>
                </div>

            </div>
        </div>

    </main>

    <!-- Footer Copyright -->
    <footer class="z-10 text-center text-[11px] text-cyan-300/40 font-cinzel mt-4">
        Dedicado con amor puro a Scoly Kinzoo &bull; Un océano de luz propia
    </footer>

    <script>
        // Set Current Date
        document.getElementById('dateDisplay').textContent = new Date().toLocaleDateString('es-ES', {
            year: 'numeric',
            month: 'long',
            day: 'numeric'
        });

        // Dedicated Letter Content for Scoly Kinzoo
        const letterLines = [
            "Para mi amada Scoly Kinzoo,",
            "\n\nEn las profundidades donde el mundo suele ser oscuro y silencioso, tú floreces con colores que desafían a la propia luz.",
            "\nComo esta criatura del océano, posees una belleza vibrante, única e inquebrantable que llena de vida todo lo que te rodea.",
            "\n\nNo naciste para adaptarte a la calma de las mareas quietas, ni para permanecer a la sombra del arrecife.",
            "\nNaciste para brillar con luz propia, para fascinar, para ser el centro radiante de tu propio universo.",
            "\n\nRecuérdalo en cada paso y en cada amanecer:",
            "\n\n¡Nunca serás espectadora!"
        ];

        const fullLetterText = letterLines.join("");

        // ----------------------------------------------------
        // 1. UNDERWATER BUBBLE CANVAS ENGINE
        // ----------------------------------------------------
        const bubbleCanvas = document.getElementById('bubbleCanvas');
        const bCtx = bubbleCanvas.getContext('2d');
        let bubbles = [];

        function resizeBubbleCanvas() {
            bubbleCanvas.width = window.innerWidth;
            bubbleCanvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeBubbleCanvas);
        resizeBubbleCanvas();

        class Bubble {
            constructor() {
                this.reset();
            }
            reset() {
                this.x = Math.random() * bubbleCanvas.width;
                this.y = bubbleCanvas.height + Math.random() * 50;
                this.radius = Math.random() * 3 + 1;
                this.speedY = Math.random() * 1.2 + 0.4;
                this.speedX = Math.sin(Math.random() * Math.PI) * 0.5;
                this.opacity = Math.random() * 0.5 + 0.2;
            }
            update() {
                this.y -= this.speedY;
                this.x += Math.sin(this.y * 0.02) * 0.4;
                if (this.y < -10) this.reset();
            }
            draw() {
                bCtx.beginPath();
                bCtx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                bCtx.fillStyle = `rgba(186, 230, 253, ${this.opacity})`;
                bCtx.shadowBlur = 4;
                bCtx.shadowColor = '#38bdf8';
                bCtx.fill();
                bCtx.shadowBlur = 0;
            }
        }

        for (let i = 0; i < 60; i++) {
            bubbles.push(new Bubble());
        }

        function animateBubbles() {
            bCtx.clearRect(0, 0, bubbleCanvas.width, bubbleCanvas.height);
            bubbles.forEach(b => {
                b.update();
                b.draw();
            });
            requestAnimationFrame(animateBubbles);
        }
        animateBubbles();

        // ----------------------------------------------------
        // 2. THREE.JS 3D SCOLYMIA / CORAL FLOWER ORGANISM
        // ----------------------------------------------------
        const container = document.getElementById('threeContainer');
        const scene = new THREE.Scene();

        // Camera
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 3, 11);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0x0e2a47, 1.8);
        scene.add(ambientLight);

        const topCyanLight = new THREE.DirectionalLight(0x38bdf8, 2.5);
        topCyanLight.position.set(5, 12, 8);
        scene.add(topCyanLight);

        const pointPinkLight = new THREE.PointLight(0xf472b6, 3, 15);
        pointPinkLight.position.set(-4, 2, 4);
        scene.add(pointPinkLight);

        const pointOrangeLight = new THREE.PointLight(0xf97316, 2.5, 15);
        pointOrangeLight.position.set(4, -2, 4);
        scene.add(pointOrangeLight);

        // Main Coral Group
        const coralGroup = new THREE.Group();
        scene.add(coralGroup);

        // Coral Stem Base
        const stemGeo = new THREE.CylinderGeometry(0.8, 1.4, 3.2, 32, 16);
        // Deform stem to look organic
        const stemPos = stemGeo.attributes.position;
        for (let i = 0; i < stemPos.count; i++) {
            let vx = stemPos.getX(i);
            let vy = stemPos.getY(i);
            let vz = stemPos.getZ(i);
            let noise = Math.sin(vy * 3) * 0.15;
            stemPos.setX(i, vx + noise);
            stemPos.setZ(i, vz + noise);
        }
        stemGeo.computeVertexNormals();

        const stemMat = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            roughness: 0.8,
            metalness: 0.1,
            flatShading: true
        });
        const stemMesh = new THREE.Mesh(stemGeo, stemMat);
        stemMesh.position.y = -1.6;
        coralGroup.add(stemMesh);

        // Coral Dome Polyps (Informed by image: vibrant tentacles/polyp cups with orange rims and cyan/blue centers)
        const polypsGroup = new THREE.Group();
        polypsGroup.position.y = 0.2;
        coralGroup.add(polypsGroup);

        // Create Dome Base Surface
        const domeRadius = 3.6;
        const polypCount = 140;
        const tentaclesList = [];

        // Geometries for Polyp Cups & Tentacles
        const cupGeo = new THREE.CylinderGeometry(0.24, 0.12, 0.35, 12);
        const tentacleGeo = new THREE.ConeGeometry(0.06, 0.45, 8);

        // Color palettes for polyps
        const centerCyanColor = new THREE.Color(0x06b6d4);
        const middlePurpleColor = new THREE.Color(0x8b5cf6);
        const outerOrangeColor = new THREE.Color(0xf97316);

        for (let i = 0; i < polypCount; i++) {
            // Fibonacci Sphere distribution for even dome coverage
            const phi = Math.acos(-1 + (2 * i) / polypCount);
            const theta = Math.sqrt(polypCount * Math.PI) * phi;

            // Constrain to top hemisphere dome
            if (phi > Math.PI * 0.48) continue;

            const x = domeRadius * Math.sin(phi) * Math.cos(theta);
            const y = (domeRadius * 0.65) * Math.cos(phi);
            const z = domeRadius * Math.sin(phi) * Math.sin(theta);

            const polypHolder = new THREE.Group();
            polypHolder.position.set(x, y, z);

            // Orient towards normal direction
            const normal = new THREE.Vector3(x, y * 1.5, z).normalize();
            polypHolder.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), normal);

            // Calculate color gradient based on distance from central apex
            const distFromTop = Math.sqrt(x*x + z*z) / domeRadius;
            let polypColor = new THREE.Color();
            if (distFromTop < 0.35) {
                polypColor.lerpColors(centerCyanColor, middlePurpleColor, distFromTop / 0.35);
            } else {
                polypColor.lerpColors(middlePurpleColor, outerOrangeColor, (distFromTop - 0.35) / 0.65);
            }

            // Polyp Cup
            const cupMat = new THREE.MeshStandardMaterial({
                color: polypColor,
                roughness: 0.3,
                metalness: 0.2,
                emissive: polypColor,
                emissiveIntensity: 0.35
            });
            const cupMesh = new THREE.Mesh(cupGeo, cupMat);
            polypHolder.add(cupMesh);

            // Inner Bioluminescent Core Dot
            const coreGeo = new THREE.SphereGeometry(0.08, 8, 8);
            const coreMat = new THREE.MeshBasicMaterial({ color: 0x67e8f9 });
            const coreMesh = new THREE.Mesh(coreGeo, coreMat);
            coreMesh.position.y = 0.15;
            polypHolder.add(coreMesh);

            // Mini Tentacles around each polyp rim
            const tentacleCount = 6;
            for (let t = 0; t < tentacleCount; t++) {
                const angle = (t / tentacleCount) * Math.PI * 2;
                const tx = Math.cos(angle) * 0.2;
                const tz = Math.sin(angle) * 0.2;

                const tentMat = new THREE.MeshStandardMaterial({
                    color: (distFromTop > 0.4) ? 0xfba518 : 0x38bdf8,
                    emissive: (distFromTop > 0.4) ? 0xf59e0b : 0x0284c7,
                    emissiveIntensity: 0.4,
                    roughness: 0.2
                });
                const tentMesh = new THREE.Mesh(tentacleGeo, tentMat);
                tentMesh.position.set(tx, 0.22, tz);
                tentMesh.rotation.x = Math.PI * 0.15;
                tentMesh.rotation.y = angle;

                polypHolder.add(tentMesh);

                // Keep reference for animated swaying movement
                tentaclesList.push({
                    mesh: tentMesh,
                    baseRotX: Math.PI * 0.15,
                    phase: Math.random() * Math.PI * 2
                });
            }

            polypsGroup.add(polypHolder);
        }

        // Initial scale for bloom animation
        coralGroup.scale.set(0.01, 0.01, 0.01);

        // Mouse Drag / Touch Controls
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0;
        let targetRotationY = 0;
        let autoRotate = true;

        container.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        container.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            targetRotationY += deltaX * 0.008;
            targetRotationX += deltaY * 0.008;

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        window.addEventListener('mouseup', () => { isDragging = false; });

        // Touch controls
        container.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });

        container.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            const deltaX = e.touches[0].clientX - previousMousePosition.x;
            const deltaY = e.touches[0].clientY - previousMousePosition.y;

            targetRotationY += deltaX * 0.008;
            targetRotationX += deltaY * 0.008;

            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });

        container.addEventListener('touchend', () => { isDragging = false; });

        // Mouse Wheel Zoom
        container.addEventListener('wheel', (e) => {
            camera.position.z += e.deltaY * 0.005;
            camera.position.z = Math.max(6, Math.min(18, camera.position.z));
        }, { passive: true });

        // Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // ----------------------------------------------------
        // 3. ANIMATION LOOP & BLOOM SEQUENCE
        // ----------------------------------------------------
        let clock = new THREE.Clock();

        function animate3D() {
            requestAnimationFrame(animate3D);

            const elapsedTime = clock.getElapsedTime();

            // Continuous 3D rotation & Floating current motion
            if (autoRotate) {
                targetRotationY += 0.005;
            }

            coralGroup.rotation.y += (targetRotationY - coralGroup.rotation.y) * 0.05;
            coralGroup.rotation.x += (targetRotationX - coralGroup.rotation.x) * 0.05;

            // Gentle floating on water current
            coralGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.25;
            coralGroup.rotation.z = Math.sin(elapsedTime * 0.8) * 0.04;

            // Swaying tentacles movement
            tentaclesList.forEach((t, idx) => {
                t.mesh.rotation.x = t.baseRotX + Math.sin(elapsedTime * 3 + t.phase) * 0.12;
            });

            renderer.render(scene, camera);
        }
        animate3D();

        // Sequential Growth & Bloom Control
        const statusIndicator = document.getElementById('statusIndicator');
        const typewriterEl = document.getElementById('typewriterText');
        const cardFooter = document.getElementById('cardFooter');
        const coralAura = document.getElementById('coralAura');

        let isTyping = false;

        function runSequence() {
            // Reset
            coralGroup.scale.set(0.01, 0.01, 0.01);
            container.classList.remove('glowing');
            coralAura.style.opacity = '0.3';
            typewriterEl.textContent = '';
            typewriterEl.classList.add('typing-cursor');
            cardFooter.style.opacity = '0';
            cardFooter.style.pointerEvents = 'none';

            statusIndicator.textContent = "1. Germinando núcleo marino...";

            // Scale up coral smoothly (Bloom effect)
            let scaleProgress = 0.01;
            const growInterval = setInterval(() => {
                scaleProgress += 0.03;
                if (scaleProgress >= 1) {
                    scaleProgress = 1;
                    clearInterval(growInterval);
                    statusIndicator.textContent = "2. Expandiendo tentáculos bioluminiscentes...";
                    
                    setTimeout(() => {
                        statusIndicator.textContent = "3. Coral en plenitud • Escribiendo dedicatoria...";
                        startTypewriter();
                    }, 1200);
                }
                coralGroup.scale.set(scaleProgress, scaleProgress, scaleProgress);
            }, 50);
        }

        function startTypewriter() {
            if (isTyping) return;
            isTyping = true;

            let charIndex = 0;
            const speed = 40;

            function typeNextChar() {
                if (charIndex < fullLetterText.length) {
                    typewriterEl.textContent += fullLetterText.charAt(charIndex);
                    charIndex++;
                    setTimeout(typeNextChar, speed);
                } else {
                    isTyping = false;
                    typewriterEl.classList.remove('typing-cursor');
                    triggerPostWritingFX();
                }
            }

            typeNextChar();
        }

        function triggerPostWritingFX() {
            // Radiant Aura & Enhanced Glow
            container.classList.add('glowing');
            coralAura.style.opacity = '0.9';

            statusIndicator.textContent = "✦ Escultura bioluminescente en giro continuo ✦";

            // Reveal Footer Actions
            cardFooter.style.opacity = '1';
            cardFooter.style.pointerEvents = 'auto';
        }

        // Replay Button
        document.getElementById('replayBtn').addEventListener('click', () => {
            runSequence();
        });

        // Download Action
        document.getElementById('downloadBtn').addEventListener('click', () => {
            const htmlContent = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
            const blob = new Blob([htmlContent], { type: 'text/html;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            
            const link = document.createElement('a');
            link.href = url;
            link.download = "Para_Scoly_Kinzoo_Carta_Coral_3D.html";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        // Ambient Underwater Audio Synthesizer
        let audioCtx = null;
        let isSoundPlaying = false;
        let mainGain = null;
        let osc1 = null, osc2 = null;

        document.getElementById('soundToggle').addEventListener('click', () => {
            const soundText = document.getElementById('soundText');

            if (!isSoundPlaying) {
                if (!audioCtx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    audioCtx = new AudioContext();
                }

                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                mainGain = audioCtx.createGain();
                mainGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
                mainGain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 3);

                osc1 = audioCtx.createOscillator();
                osc2 = audioCtx.createOscillator();

                osc1.type = 'sine';
                osc2.type = 'sine';

                // Soft oceanic chords
                osc1.frequency.setValueAtTime(146.83, audioCtx.currentTime); // D3
                osc2.frequency.setValueAtTime(220.00, audioCtx.currentTime); // A3

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, audioCtx.currentTime);

                osc1.connect(filter);
                osc2.connect(filter);
                filter.connect(mainGain);
                mainGain.connect(audioCtx.destination);

                osc1.start();
                osc2.start();

                isSoundPlaying = true;
                soundText.textContent = "Ecos: Activados";
            } else {
                if (mainGain) {
                    mainGain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1);
                    setTimeout(() => {
                        osc1?.stop();
                        osc2?.stop();
                    }, 1000);
                }
                isSoundPlaying = false;
                soundText.textContent = "Ecos Marinos";
            }
        });

        // Start Sequence
        window.addEventListener('DOMContentLoaded', () => {
            runSequence();
        });
    </script>
</body>
</html>
